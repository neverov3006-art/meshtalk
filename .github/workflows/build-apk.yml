name: Build debug APK

# Runs automatically on every push to main, and can also be triggered manually from
# the Actions tab (the "Run workflow" button) without needing a new commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs and runs Gradle directly (rather than via a checked-in ./gradlew
      # wrapper) — keeps the repo free of a binary wrapper jar and always builds with
      # a known-good Gradle version.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      # Uploads the built APK so it shows up under the workflow run's "Artifacts"
      # section — downloadable as a zip directly from the GitHub Actions web page.
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: meshtalk-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
